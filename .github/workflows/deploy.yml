name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      HUGO_VERSION: 0.134.3
      HUGO_SHA256: 287e562749a7df45900e21d5dcb737f307a2b272cfc8aefef24255c3674a9793
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install Hugo
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          echo "${HUGO_SHA256}  ${{ runner.temp }}/hugo.deb" | sha256sum -c -
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Cache key for apt packages
        id: apt-key
        run: echo "os=${ImageOS:-ubuntu}" >> "$GITHUB_OUTPUT"

      - name: Restore downloaded apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: apt-${{ steps.apt-key.outputs.os }}-${{ hashFiles('.github/workflows/deploy.yml') }}
          restore-keys: apt-${{ steps.apt-key.outputs.os }}-

      - name: Install pandoc, TeX Live and poppler
        run: |
          mkdir -p ~/apt-cache
          sudo cp -n ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o APT::Keep-Downloaded-Packages=true"
          sudo apt-get update -q $APT_OPTS
          sudo apt-get install -y -q --no-install-recommends $APT_OPTS pandoc \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-lang-english cm-super poppler-utils qpdf
          cp -n /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true
          pandoc --version | head -1
          pdflatex --version | head -1
          pdftoppm -v 2>&1 | head -1

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Convert LaTeX → HTML, build proof PDFs and previews
        run: python3 scripts/convert.py --pdf

      - name: Build site
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Email subscribers
        env:
          MAILERLITE_TOKEN: ${{ secrets.MAILERLITE_TOKEN }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 scripts/notify.py
