{{ define "main" }}
<article class="post">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div class="lede">{{ . }}</div>{{ end }}
  </header>
  {{ partial "subscribe.html" (dict "compact" false) }}
  {{ with .Params.figure_caption }}<p class="photo-credit">{{ . }}</p>{{ end }}
</article>
{{ end }}
