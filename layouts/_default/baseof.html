<!DOCTYPE html>
<html lang="{{ site.LanguageCode | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}home{{ else }}page kind-{{ .Kind }} section-{{ .Section }}{{ with .Layout }} layout-{{ . }}{{ end }}{{ end }}">
  {{ partial "header.html" . }}
  <main id="main" class="container">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "katex.html" . }}
</body>
</html>
